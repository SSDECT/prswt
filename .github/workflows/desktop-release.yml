# DSK-08: builds the PRSWT desktop app for Windows, Linux and macOS
# (Apple Silicon and Intel) with tools/package-desktop.sh, runs the gate's
# tests on each OS, and attaches the packages to a GitHub release for tags
# `v*`. Manual runs (workflow_dispatch) keep the packages as build artifacts.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: ""
          - os: ubuntu-22.04
            target: ""
          - os: macos-14
            target: ""
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
      - name: Tests (desktop, UI, engine)
        shell: bash
        working-directory: engine
        run: cargo test --locked -p prswt-desktop -p prswt-ui -p prswt-app -p prswt-state
      - name: Package
        shell: bash
        run: bash tools/package-desktop.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: prswt-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
