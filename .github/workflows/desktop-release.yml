# DSK-08: builds the PRSWT desktop app for Windows, Linux and macOS
# (Apple Silicon and Intel) with tools/package-desktop.sh, runs the gate's
# tests on each OS, and attaches the packages to a GitHub release for tags
# `v*`. Manual runs (workflow_dispatch) keep the packages as build artifacts.
#
# Signing (docs/signing.md): Windows through Azure Trusted Signing, macOS with
# a Developer ID certificate plus notarization. Each runs when its secrets are
# set; a release tag without them fails instead of shipping unsigned.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: ""
          - os: ubuntu-22.04
            target: ""
          - os: macos-14
            target: ""
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      WIN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
      MAC_SIGN: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - name: Signing configured for release
        if: startsWith(github.ref, 'refs/tags/v') && ((runner.os == 'Windows' && env.WIN_SIGN != 'true') || (runner.os == 'macOS' && env.MAC_SIGN != 'true'))
        shell: bash
        run: |
          echo "::error::release tags must be signed; add the signing secrets (docs/signing.md)"
          exit 1
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
      - name: Tests (desktop, UI, engine)
        shell: bash
        working-directory: engine
        run: cargo test --locked -p prswt-desktop -p prswt-ui -p prswt-app -p prswt-state
      - name: Build (Windows, to sign before packaging)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        shell: bash
        working-directory: engine
        run: cargo build --release --locked -p prswt-desktop
      - name: Sign prswt.exe (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.WIN_SIGN == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: engine/target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MAC_SIGN == 'true'
        shell: bash
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package
        shell: bash
        env:
          PRSWT_PREBUILT: ${{ runner.os == 'Windows' && env.WIN_SIGN == 'true' && '1' || '' }}
          MACOS_SIGN_IDENTITY: ${{ env.MAC_SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash tools/package-desktop.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: prswt-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
