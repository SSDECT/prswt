[package]
name = "prswt-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prswt-core.workspace = true
prswt-app.workspace = true
prswt-api.workspace = true
prswt-mcp.workspace = true
prswt-store.workspace = true
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
futures-util = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = "1.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync", "time"] }
rcgen = "0.14.10"
tower = { version = "0.5.3", features = ["util"] }
