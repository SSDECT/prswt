[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # imbl (persistent maps): MPL-2.0 is per-file weak copyleft; we use it
    # unmodified, so no obligations reach PRSWT code. GPL/LGPL/AGPL stay banned.
    "MPL-2.0",
    # webpki-roots (Mozilla CA bundle data, via rustls for Postgres TLS).
    "CDLA-Permissive-2.0",
    # egui default fonts (epaint_default_fonts): permissive font licences that
    # allow bundling. GridCraft moves fonts to a separate repo; see docs/gaps.md.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
